name: CPU contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.14.4'
            r-client: true
          - os: ubuntu-24.04
            python: '3.11.18'
            r-client: false
          - os: macos-14
            python: '3.14.4'
            r-client: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install R client prerequisites
        if: matrix.r-client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base-core r-cran-curl r-cran-jsonlite
      - run: python -m pip install --only-binary=":all:" -r requirements-cpu.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m pip check
      - run: python scripts/check_cpu.py
      - run: cttir-model audit --config configs/cpu.json
